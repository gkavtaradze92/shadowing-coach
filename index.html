<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Shadowing Coach</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="topbar">
    <h1>Shadowing Coach</h1>
  </header>

  <main>
    <!-- 1. Script -->
    <section class="card" id="script-card">
      <h2>Script</h2>
      <label class="field">
        <span>Title</span>
        <input id="title" type="text" placeholder="e.g. 5 AM Contract" autocomplete="off">
      </label>
      <label class="field">
        <span>Text</span>
        <textarea id="script-text" rows="10" placeholder="Paste your English script here..."></textarea>
      </label>
      <button id="split-btn" class="btn primary wide" type="button">Split into segments</button>
    </section>

    <!-- 2. Segments -->
    <section class="card" id="segments-card">
      <h2>Segments <span id="segment-count" class="muted"></span></h2>
      <p id="segments-empty" class="muted">Paste a script and press “Split into segments”.</p>
      <ol id="segment-list" class="segment-list"></ol>
    </section>

    <!-- 3. Settings -->
    <section class="card" id="settings-card">
      <h2>Settings</h2>

      <div class="field">
        <span>Mode</span>
        <div class="chips" id="mode-chips"></div>
      </div>

      <label class="field">
        <span>Voice</span>
        <select id="voice"></select>
      </label>

      <div class="field">
        <span>Speed</span>
        <div class="chips" id="speed-chips"></div>
      </div>

      <div class="field">
        <span>Pause after each segment</span>
        <div class="chips" id="pause-chips"></div>
      </div>
    </section>

    <!-- 4. Generate -->
    <section class="card" id="generate-card">
      <button id="generate-btn" class="btn primary wide big" type="button" disabled>Generate audio</button>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress-text" class="progress-text"></p>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <!-- 5. Player -->
    <section class="card" id="player-card">
      <h2>Player</h2>
      <p id="player-empty" class="muted">Generate audio to start listening.</p>
      <audio id="audio" preload="auto" playsinline></audio>
      <div id="player-ui" hidden>
        <p id="now-text" class="now-text"></p>
        <p id="player-time" class="muted center"></p>
        <div class="controls">
          <button id="prev-btn" class="btn icon" type="button" aria-label="Previous">⏮</button>
          <button id="replay-btn" class="btn icon" type="button" aria-label="Replay segment">↺</button>
          <button id="play-btn" class="btn icon play" type="button" aria-label="Play">▶</button>
          <button id="next-btn" class="btn icon" type="button" aria-label="Next">⏭</button>
          <button id="stop-btn" class="btn icon" type="button" aria-label="Stop">■</button>
        </div>
        <div class="row">
          <button id="download-btn" class="btn wide" type="button">Download MP3</button>
          <button id="camera-btn" class="btn wide" type="button">Camera Mode</button>
        </div>
      </div>
    </section>

    <!-- 6. Saved scripts -->
    <section class="card" id="library-card">
      <h2>My scripts</h2>
      <button id="save-btn" class="btn wide" type="button">Save current script</button>
      <ul id="library-list" class="library-list"></ul>
    </section>
  </main>

  <!-- Camera Mode screen (full screen overlay) -->
  <div id="camera-screen" class="camera-screen" hidden>
    <button id="camera-close" class="btn camera-close" type="button" aria-label="Close">✕</button>
    <p id="camera-progress" class="camera-progress"></p>
    <p id="camera-text" class="camera-text"></p>
    <div class="controls">
      <button id="camera-replay" class="btn icon" type="button" aria-label="Replay segment">↺</button>
      <button id="camera-play" class="btn icon play" type="button" aria-label="Play">▶</button>
    </div>
  </div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
